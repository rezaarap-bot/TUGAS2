<!DOCTYPE html>
<html>
<body>
    <h2>Latihan Perulangan</h2>
    <script>
        document.write("<b>1. Cetak Teks 10 Kali:</b><br>");
        for (let i = 1; i <= 10; i++) {
            document.write(i + ". Saya Berjanji Akan Rajin Belajar Coding<br>");
        }

        document.write("<br><b>2. Deret Angka Genap (2 - 20):</b><br>");
        for (let i = 2; i <= 20; i += 2) {
            document.write(i + " ");
        }

        document.write("<br><br><b>3. Cetak Bintang 30 Kali:</b><br>");
        for (let i = 1; i <= 30; i++) {
            document.write("*");
        }
    </script>
</body>
</html>
